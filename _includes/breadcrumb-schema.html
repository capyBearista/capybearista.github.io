<!-- Breadcrumb Structured Data -->
{% unless page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}"
    }
    {% if page.layout == 'post' %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ '/blog/' | absolute_url }}"
    }
    ,{
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title | escape }}",
      "item": "{{ page.url | absolute_url }}"
    }
    {% elsif page.url contains '/blog' %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ '/blog/' | absolute_url }}"
    }
    {% elsif page.url contains '/projects' %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Projects",
      "item": "{{ '/projects/' | absolute_url }}"
    }
    {% elsif page.url contains '/interests' %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Interests",
      "item": "{{ '/interests/' | absolute_url }}"
    }
    {% else %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title | escape }}",
      "item": "{{ page.url | absolute_url }}"
    }
    {% endif %}
  ]
}
</script>
{% endunless %}
